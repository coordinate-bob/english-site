<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="paybg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ecfdf5"/>
      <stop offset="100%" stop-color="#d1fae5"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#paybg)"/>
  <!-- 手机 -->
  <g transform="translate(400 225) rotate(-4)">
    <rect x="-110" y="-185" width="220" height="370" rx="28" fill="#1e293b"/>
    <rect x="-96" y="-160" width="192" height="320" rx="8" fill="#f8fafc"/>
    <!-- 二维码 -->
    <g transform="translate(0 -20)">
      <rect x="-70" y="-70" width="140" height="140" fill="#fff" stroke="#e2e8f0" stroke-width="2"/>
      <g fill="#0f172a">
        <rect x="-58" y="-58" width="36" height="36"/><rect x="22" y="-58" width="36" height="36"/>
        <rect x="-58" y="22" width="36" height="36"/>
        <rect x="-50" y="-50" width="20" height="20" fill="#fff"/><rect x="30" y="-50" width="20" height="20" fill="#fff"/>
        <rect x="-50" y="30" width="20" height="20" fill="#fff"/>
        <rect x="-45" y="-45" width="10" height="10"/><rect x="35" y="-45" width="10" height="10"/>
        <rect x="-45" y="35" width="10" height="10"/>
        <rect x="-12" y="-58" width="14" height="14"/><rect x="6" y="-40" width="12" height="12"/>
        <rect x="-14" y="-16" width="12" height="12"/><rect x="4" y="2" width="16" height="16"/>
        <rect x="-30" y="8" width="12" height="12"/><rect x="28" y="30" width="12" height="12"/>
        <rect x="-8" y="34" width="12" height="12"/><rect x="-32" y="40" width="10" height="10"/>
        <rect x="-58" y="-8" width="12" height="12"/><rect x="40" y="-16" width="10" height="10"/>
      </g>
    </g>
    <!-- 扫描框 -->
    <rect x="-84" y="-104" width="168" height="168" fill="none" stroke="#10b981" stroke-width="6" rx="8"/>
    <line x1="-84" y1="-20" x2="84" y2="-20" stroke="#10b981" stroke-width="4" opacity="0.8"/>
    <!-- 提示文字与金额 -->
    <text x="0" y="112" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#10b981">¥ 12.50</text>
    <text x="0" y="142" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#64748b">支付成功</text>
  </g>
  <!-- 手势暗示 -->
  <g transform="translate(586 130) rotate(14)" opacity="0.9">
    <rect x="-14" y="0" width="28" height="96" rx="14" fill="#fbbf24"/>
    <circle cx="0" cy="-6" r="18" fill="#fcd34d"/>
  </g>
  <!-- 装饰圆点 -->
  <circle cx="150" cy="110" r="10" fill="#6ee7b7"/>
  <circle cx="196" cy="150" r="6" fill="#a7f3d0"/>
  <circle cx="132" cy="176" r="5" fill="#6ee7b7"/>
</svg>
