    <ellipse cx="0" cy="0" rx="95" ry="16" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="4"/>
    <!-- 米饭 -->
    <g fill="#ffffff" stroke="#e2e8f0" stroke-width="3">
