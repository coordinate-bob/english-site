<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="porbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#porbg)"/>
  <!-- 展架 -->
  <rect y="368" width="800" height="82" fill="#bfdbfe"/>
  <rect y="368" width="800" height="10" fill="#93c5fd"/>
  <!-- 青花大瓶 -->
  <g transform="translate(330 210)">
    <path d="M-18 -150 L18 -150 L14 -118 Q70 -96 76 -20 Q80 60 34 96 Q18 108 0 108 Q-18 108 -34 96 Q-80 60 -76 -20 Q-70 -96 -14 -118 Z" fill="#f8fafc" stroke="#1e40af" stroke-width="5"/>
